# Enable mouse support (scrolling, pane selection, resizing)
set -g mouse on

# True color support for Ghostty
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Enable focus events (lets Neovim detect focus changes)
set -g focus-events on

# Extended keys support (proper modifier key handling in Ghostty)
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features 'xterm-ghostty:extkeys'

# Allow tmux to set clipboard via OSC 52 (system clipboard integration)
set -g set-clipboard on

# Increase scrollback buffer (default is 2000)
set -g history-limit 50000

# Start window/pane numbering at 1 (easier to reach)
set -g base-index 1
setw -g pane-base-index 1

# Reduce escape delay (important for Vim/Neovim users)
set -sg escape-time 0

# Renumber windows when one is closed
set -g renumber-windows on

# Easier pane splitting (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows open in current directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (repeatable with -r)
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded"