# Enable mouse support (scrolling, pane selection, resizing)
set -g mouse on

# True color support for Ghostty
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# Increase scrollback buffer (default is 2000)
set -g history-limit 50000

# Start window/pane numbering at 1 (easier to reach)
set -g base-index 1
setw -g pane-base-index 1

# Reduce escape delay (important for Vim/Neovim users)
set -sg escape-time 0

# Renumber windows when one is closed
set -g renumber-windows on

# Easier pane splitting (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display "Config reloaded"
